name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write  # Required for keyless signing with Cosign

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -race ./...

      - name: Build binary
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: evroc-ccm-binary
          path: bin/evroc-ccm
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image with Cosign (keyless)
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          echo "Signing image with digest: ${DIGEST}"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
          config: .github/release/sbom.yaml
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Generate SLSA provenance attestation
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
        run: |
          BUILD_STARTED_ON=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PROVENANCE=$(<.github/release/provenance.json.tmpl)
          PROVENANCE=${PROVENANCE//@VERSION@/${VERSION}}
          PROVENANCE=${PROVENANCE//@REPOSITORY@/${REPO}}
          PROVENANCE=${PROVENANCE//@GIT_SHA@/${GIT_SHA}}
          PROVENANCE=${PROVENANCE//@BUILD_STARTED_ON@/${BUILD_STARTED_ON}}
          PROVENANCE=${PROVENANCE//@BUILD_FINISHED_ON@/$(date -u +%Y-%m-%dT%H:%M:%SZ)}
          printf '%s\n' "$PROVENANCE" > provenance.json
          jq empty provenance.json

          cosign attest --yes --predicate provenance.json --type slsaprovenance "ghcr.io/${{ github.repository }}@${DIGEST}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.16.3'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NO_V=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          sed -i "s/^version:.*/version: ${VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/Chart.yaml

      - name: Package Helm chart
        run: |
          cd chart
          helm package .
          cd ..

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Helm chart package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd chart
          cosign sign-blob --yes "evroc-ccm-${VERSION}.tgz" --bundle "evroc-ccm-${VERSION}.tgz.bundle"
          cd ..

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          VERSION_NO_V: ${{ steps.get_version.outputs.VERSION_NO_V }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          NOTES=$(<.github/release/release-notes.md.tmpl)
          NOTES=${NOTES//@VERSION@/${VERSION}}
          NOTES=${NOTES//@VERSION_NO_V@/${VERSION_NO_V}}
          NOTES=${NOTES//@REPOSITORY@/${REPO}}
          NOTES=${NOTES//@REPOSITORY_OWNER@/${REPO_OWNER}}
          printf '%s\n' "$NOTES" > release_notes.txt

      # GitHub CLI: Creates GitHub release with artifacts
      # Replaced softprops/action-gh-release to comply with org policy
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.txt \
            chart/evroc-ccm-*.tgz \
            chart/evroc-ccm-*.tgz.bundle

      - name: Log in to GitHub Container Registry for Helm
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR OCI registry
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd chart
          helm push evroc-ccm-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          cd ..
