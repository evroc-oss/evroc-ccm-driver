{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "evroc-ccm.fullname" . }}
  labels:
    {{- include "evroc-ccm.labels" . | nindent 4 }}
rules:
  # Node management (topology labeling, provider ID, addresses)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  # Events for reporting node updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # Services for the load balancer controller
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "evroc-ccm.fullname" . }}
  labels:
    {{- include "evroc-ccm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "evroc-ccm.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "evroc-ccm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# With --use-service-account-credentials the controller manager runs each
# controller as its own ServiceAccount in kube-system, bound by the API
# server's bootstrap policy (system:controller:node-controller and
# system:controller:service-controller). Minting tokens is limited to those
# two accounts so the CCM cannot obtain a token for any other ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "evroc-ccm.fullname" . }}-controller-accounts
  namespace: kube-system
  labels:
    {{- include "evroc-ccm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["node-controller", "service-controller"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["node-controller", "service-controller"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "evroc-ccm.fullname" . }}-controller-accounts
  namespace: kube-system
  labels:
    {{- include "evroc-ccm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "evroc-ccm.fullname" . }}-controller-accounts
subjects:
  - kind: ServiceAccount
    name: {{ include "evroc-ccm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.ccm.metrics.enabled }}
---
# The metrics endpoint's delegated authentication reads the
# extension-apiserver-authentication ConfigMap in kube-system to load the
# request-header CA. Without this binding the process exits at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "evroc-ccm.fullname" . }}-authentication-reader
  namespace: kube-system
  labels:
    {{- include "evroc-ccm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "evroc-ccm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
