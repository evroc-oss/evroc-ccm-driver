# Example 4: Node Scaling and Backend Reconciliation
#
# This example demonstrates how the CCM keeps the LoadBalancer's backend pool
# in sync as nodes join and leave the cluster.
#
# The CCM does NOT decide when to scale — Kubernetes drives that.
# The CCM reacts to node changes by reconciling the BackendPool.
#
# Usage:
#   kubectl apply -f examples/04-scaling.yaml
#   kubectl get svc scaling-demo -w                       # wait for EXTERNAL-IP
#
#   # Scale the Deployment (pods change, but LB backends are nodes, not pods):
#   kubectl scale deployment scaling-demo --replicas=10
#   # Backend pool stays the same — only node changes trigger CCM updates.
#
# Scale the cluster's node pool with its provisioning tooling to see the CCM
# add or remove VM references from the load balancer backend pool.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-demo
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scaling-demo
  template:
    metadata:
      labels:
        app: scaling-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: scaling-demo
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: scaling-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
