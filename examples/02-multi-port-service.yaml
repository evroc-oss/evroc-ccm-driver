# Example 2: Multi-Port LoadBalancer Service
#
# Exposes an application on multiple ports through a single LoadBalancer.
# The CCM creates one BackendService + L4Route per port, but they all share
# the same BackendPool (same set of nodes).
#
# Resources created by the CCM, where <lb> is ccm-<24 hex chars> derived from
# the Service UID (see examples/01-basic-loadbalancer.yaml):
#   - PublicIP              (<lb>-ip)
#   - BackendPool           (<lb>-pool)               — shared across all listeners
#   - BackendService        (<lb>-http-80-svc)        — port 80 → NodePort 1
#   - BackendService        (<lb>-https-443-svc)      — port 443 → NodePort 2
#   - BackendService        (<lb>-metrics-9090-svc)   — port 9090 → NodePort 3
#   - L4Route               (<lb>-http-80-route)
#   - L4Route               (<lb>-https-443-route)
#   - L4Route               (<lb>-metrics-9090-route)
#   - LoadBalancer          (<lb>)                    — 3 TCP listeners
#
# Traffic flow (per port):
#   Client :80  → LB :80  → Node :31080 → Pod :8080
#   Client :443 → LB :443 → Node :31443 → Pod :8443
#   Client :9090 → LB :9090 → Node :31090 → Pod :9090
#
# Usage:
#   kubectl apply -f examples/02-multi-port-service.yaml
#   kubectl get svc myapp -w

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        # agnhost's netexec serves HTTP on every port it is given, so all three
        # listeners can be exercised without a custom image.
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: myapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
    - name: metrics
      port: 9090
      targetPort: 9090
