# Source: evroc-ccm/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evroc-ccm
  labels:
    helm.sh/chart: evroc-ccm-0.1.3
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/instance: evroc-ccm
    app.kubernetes.io/version: "0.1.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: evroc
rules:
  # Node management (topology labeling, provider ID, addresses)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  # Events for reporting node updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # The controller manager builds a delegated client per controller, which
  # reads the controller's ServiceAccount and mints a token for it.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Services for the load balancer controller
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
