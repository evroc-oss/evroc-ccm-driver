---
apiVersion: v1
kind: Namespace
metadata:
  name: evroc-system
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evroc-ccm
  namespace: evroc-system
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:evroc-ccm
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
rules:
  # Node management (topology labeling, provider ID, addresses)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  # Events for reporting node updates
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  # Services for the load balancer controller
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # The controller manager builds a delegated client per controller, which
  # reads the controller's ServiceAccount and mints a token for it.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Coordination for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:evroc-ccm
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:evroc-ccm
subjects:
  - kind: ServiceAccount
    name: evroc-ccm
    namespace: evroc-system
---
# The controller manager's delegated authentication reads the
# extension-apiserver-authentication ConfigMap in kube-system to load the
# request-header CA. Without this binding the process exits at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evroc-ccm-authentication-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: evroc-ccm
    namespace: evroc-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evroc-ccm
  namespace: evroc-system
  labels:
    app.kubernetes.io/name: evroc-ccm
    app.kubernetes.io/part-of: evroc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evroc-ccm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evroc-ccm
        app.kubernetes.io/part-of: evroc
    spec:
      serviceAccountName: evroc-ccm
      priorityClassName: system-cluster-critical
      # Prefer control-plane nodes, matching on the label's presence so that
      # both the kubeadm ("") and k3s/RKE2 ("true") conventions are accepted. A
      # nodeSelector cannot do this, because it matches on the exact value.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evroc-ccm
          image: ghcr.io/evroc-oss/evroc-ccm-driver:latest
          args:
            - --cloud-provider=evroc
            - --cloud-config=/etc/evroc/config.yaml
            - --controllers=cloud-node-controller,cloud-node-lifecycle-controller,service-lb-controller
            - --leader-elect=true
            - --use-service-account-credentials=true
            - --v=2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cloud-config
              mountPath: /etc/evroc
              readOnly: true
      volumes:
        - name: cloud-config
          secret:
            secretName: evroc-config
